name: Check hosted app
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Format, types, lint, PostgreSQL journeys and frontend build
        run: docker compose run --rm checks
      - name: Build the published image
        run: docker compose build app
      - name: Logs on failure
        if: failure()
        run: docker compose --profile checks logs --no-color
