services:
  checks:
    profiles: [checks]
    image: oven/bun:1.4.2
    working_dir: /app
    volumes:
      - .:/app
      - dependencies:/app/node_modules
    command: sh -c "bun install --frozen-lockfile && bun run format:check && bun run check && bun run lint && bun test tests && bun run build"
    environment:
      TEST_DATABASE_URL: postgres://notes:notes@checks-postgres:5432/notes_checks?sslmode=disable
    depends_on:
      checks-postgres:
        condition: service_healthy
  checks-postgres:
    profiles: [checks]
    image: postgres:18
    environment:
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: notes
      POSTGRES_DB: notes_checks
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes -d notes_checks"]
      interval: 1s
      timeout: 2s
      retries: 30
  app:
    build: .
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    environment:
      RUKIE_APP_ENV: ${RUKIE_APP_ENV:-production}
      RUKIE_PUBLIC_URLS: '{"web":"${PUBLIC_APP_URL:-http://localhost:${PORT:-8080}}/"}'
      DATABASE_URL: postgres://notes:notes@postgres:5432/notes?sslmode=disable
      BLOB_STORAGE_URL: http://blobs:8080/blobs
      BLOB_STORAGE_TOKEN: local-development-only
      RUKIE_API_URL: http://blobs:8080
      REPORT_CONVERSATION_ID: local-demo
      WELCOME_MESSAGE: Notes that stay with you across releases.
    depends_on:
      postgres:
        condition: service_healthy
      blobs:
        condition: service_started
  blobs:
    image: oven/bun:1.4.2-slim
    command: bun /devtools/services.ts
    volumes:
      - ./devtools/services.ts:/devtools/services.ts:ro
      - attachments_data:/data
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: notes
      POSTGRES_DB: notes
    volumes:
      - notes_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes -d notes"]
      interval: 1s
      timeout: 3s
      retries: 30
volumes:
  notes_data:
  attachments_data:
  dependencies:
