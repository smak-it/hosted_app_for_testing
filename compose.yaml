services:
  app:
    build: .
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://notes:notes@postgres:5432/notes?sslmode=disable
      WELCOME_MESSAGE: Notes that stay with you across releases.
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: notes
      POSTGRES_DB: notes
    volumes:
      - notes_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes -d notes"]
      interval: 1s
      timeout: 3s
      retries: 30
volumes:
  notes_data:
